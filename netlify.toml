# This site has no build step. Netlify copies the website files into a folder
# called "public" and publishes that folder (the folder name matches the
# "Publish directory" in the Netlify dashboard).
# Keep both lines below as they are: if the command is empty or "publish" points
# somewhere else, Netlify falls back to the old Hugo settings and the deploy fails.
[build]
  publish = "public"
  command = "rm -rf public && mkdir public && cp *.html _redirects robots.txt sitemap.xml public/ && cp -R assets content media public/"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
