# Plain static site: there is nothing to build.
# The command below must stay: if it is empty, Netlify falls back to the old Hugo
# build command saved in the site settings, and the deploy fails.
[build]
  publish = "."
  command = "echo 'Static site: no build step needed'"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
